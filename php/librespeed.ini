; The image makes no outbound connection, and no PHP in it may open one
; through a URL stream: getIP.php would fetch from ipinfo.io this way if a key
; were ever set.
allow_url_fopen = Off

; Real errors go to the log, never into a response: fatal, parse, compile and
; core errors, and uncaught exceptions, which are E_ERROR. Warnings, notices
; and deprecations are not logged, so no client can fill the log with them.
; error_log stays unset, so PHP hands each line to FrankenPHP's logger, which
; the Caddyfile sends to stderr. PHP cannot open /dev/stderr itself as uid
; 65532.
display_errors = Off
log_errors = On
error_reporting = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR | E_USER_ERROR | E_RECOVERABLE_ERROR

; No X-Powered-By header naming PHP and its exact version.
expose_php = Off

; Request bodies never reach /tmp. PHP holds a body it reads in memory up to
; 16 KiB and writes the rest to a file there, but it reads none larger than
; this: it skips the body at startup and discards it at the end of the
; request, 16 KiB at a time. So the speed test's 20 MiB uploads arrive whole
; and use no disk, however many run at once. Upstream raises this to 32M,
; which under the contract's 16 MiB /tmp cuts a single upload short. The
; largest form the app posts, the telemetry record, is about 1 KiB.
post_max_size = 8K
